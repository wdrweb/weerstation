CONFIG_CPP=y
CONFIG_BME280=y
# forced mode, so when a brownout happens the sensor recovers before measuring
CONFIG_BME280_MODE_FORCED=y
CONFIG_SI7006=y
CONFIG_I2C=y
CONFIG_SENSOR=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_PICOLIBC_IO_FLOAT=y
# Without this, printk("%f") prints the literal "%f".
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_STACK_SENTINEL=y

# main() starts the HTTP server, which sets up a socket and a thread, on top of
# the usual 1 kB.
CONFIG_MAIN_STACK_SIZE=2048

# WiFi
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
# The station is IPv4 only; with IPv6 on, getaddrinfo() can hand SNTP a v6
# address that fails with ENETUNREACH.
CONFIG_NET_IPV6=n
CONFIG_ESP32_WIFI_STA_RECONNECT=y
CONFIG_WIFI_SSID="Arduino"
CONFIG_WIFI_PSK="Arduino123"

# SNTP. sntp_simple() resolves the hostname with getaddrinfo(), so a resolver
# is needed, and it takes the DNS server the lease advertises (option 6).
CONFIG_SNTP=y
CONFIG_DNS_RESOLVER=y
CONFIG_NET_DHCPV4_OPTION_DNS_ADDRESS=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=1

# CONFIG_DNS_RESOLVER enables DNS_SOCKET_DISPATCHER, which allocates an eventfd.
# The HTTP server allocates one too, and ZVFS_EVENTFD_MAX defaults to 1, so the
# server fails to initialise and silently restart-loops with nothing on port 80.
CONFIG_ZVFS_EVENTFD_MAX=2

# Web server for src/static_web_resources/
CONFIG_HTTP_SERVER=y
CONFIG_NET_TCP=y
# Only HTTP/1.1: browsers use HTTP/1.1 on plain HTTP and HTTP/2 costs flash.
CONFIG_HTTP_SERVER_VERSION_2=n
# browser uses multiple connections 
CONFIG_HTTP_SERVER_MAX_CLIENTS=6
# A context per HTTP client (6), plus the listening socket, the DNS resolver
# socket and the SNTP socket. With 10 the SNTP socket() call fails with -ENOENT
# whenever the dashboard is connected, so the clock only ever synced on boots
# where it got a socket before the browser did. 152 bytes per context.
CONFIG_NET_MAX_CONTEXTS=16
# The server polls its listening socket plus every client, five entries.
CONFIG_ZVFS_POLL_MAX=10
CONFIG_LED_STRIP=y
